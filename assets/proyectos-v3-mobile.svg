<text id="texto-039" x="44" y="2361" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">detección y actuación en un prototipo</text>
<text id="texto-040" x="44" y="2401" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">físico.</text>
<text id="texto-041" x="44" y="2459" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">Teclado, sensor infrarrojo, relé</text>
