<text id="texto-029" x="44" y="1739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#5495ff" text-anchor="start">Medición aplicada a movilidad</text>
<text id="texto-030" x="44" y="1785" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">Convertir señales GPS variables en</text>
<text id="texto-031" x="44" y="1825" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">mediciones útiles para motocicletas.</text>
<text id="texto-032" x="44" y="1883" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">Valida la calidad de la señal antes de</text>
<text id="texto-033" x="44" y="1923" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">estimar distancia y movimiento.</text>
