<text id="texto-012" x="44" y="713" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">Elegir repositorios que respondan a</text>
<text id="texto-013" x="44" y="753" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">una necesidad técnica concreta.</text>
