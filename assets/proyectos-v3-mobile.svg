<text id="texto-000" x="121" y="83" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#f1f6ff" text-anchor="start">ESCUDO Inspector</text>
<text id="texto-001" x="44" y="131" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#48e7ef" text-anchor="start">Seguridad comprensible</text>
<text id="texto-002" x="44" y="177" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">Comprender el estado de un</text>
<text id="texto-003" x="44" y="217" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">dispositivo Android sin depender de</text>
<text id="texto-004" x="44" y="257" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">análisis remotos.</text>
<text id="texto-005" x="44" y="315" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">Inspección autorizada, análisis local y</text>
<text id="texto-006" x="44" y="355" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">hallazgos de seguridad sustentados</text>
<text id="texto-007" x="44" y="395" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">en evidencia.</text>
