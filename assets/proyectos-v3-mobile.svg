<text id="texto-020" x="44" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#af87ff" text-anchor="start">Captura privada en Android</text>
<text id="texto-021" x="44" y="1249" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">Registrar transacciones autorizadas</text>
<text id="texto-022" x="44" y="1289" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#b8c7d9" text-anchor="start">con menos intervención manual.</text>
<text id="texto-023" x="44" y="1347" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">Captura automática desde</text>
<text id="texto-024" x="44" y="1387" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">notificaciones, procesamiento en el</text>
<text id="texto-025" x="44" y="1427" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#f1f6ff" text-anchor="start">dispositivo y almacenamiento cifrado.</text>
