    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2797ef"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3a5367" stroke-width=".7" opacity=".28"/></pattern>
  </defs>
