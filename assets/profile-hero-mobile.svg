<svg xmlns="http://www.w3.org/2000/svg" width="640" height="632" viewBox="0 0 640 632" role="img" aria-labelledby="title desc">
  <title id="title">Frederick Lozano — Mechatronics Engineer</title>
  <desc id="desc">Automation, robotics, AI and software. Engineering the bridge between machines, intelligence and software. A mobile engineering panel with circuit traces and sensor-to-control imagery.</desc>
