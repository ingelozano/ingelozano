    <text x="34" y="248" font-size="94" font-weight="700" letter-spacing="3" fill="#f0f6fc">LOZANO</text>
    <text x="40" y="302" font-size="28" font-weight="700" letter-spacing="1.5" fill="#67e8f9">MECHATRONICS ENGINEER</text>
    <text x="40" y="350" font-size="21" letter-spacing=".6" fill="#bacbd8">AUTOMATION // ROBOTICS // AI // SOFTWARE</text>
    <text x="40" y="399" font-size="26" fill="#d2dee8">Engineering the bridge between machines,</text>
    <text x="40" y="434" font-size="26" fill="#d2dee8">intelligence and software.</text>
