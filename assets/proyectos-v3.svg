<text id="texto-008" x="753" y="85" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#f1f6ff" text-anchor="start">OpenScout</text>
<text id="texto-009" x="676" y="133" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#5495ff" text-anchor="start">Descubrimiento con evidencia</text>
<text id="texto-010" x="676" y="179" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">Elegir repositorios que respondan a una</text>
<text id="texto-011" x="676" y="210" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">necesidad técnica concreta.</text>
<text id="texto-012" x="676" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">Descubre y clasifica proyectos de código abierto</text>
<text id="texto-013" x="676" y="290" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">mediante metadatos y evidencia de sus</text>
<text id="texto-014" x="676" y="321" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">README.</text>
