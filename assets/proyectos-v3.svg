<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1300" width="1280" height="1300" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Proyectos destacados de Frederick Lozano</title><desc id="descripcion">ESCUDO Inspector, OpenScout, CreditCoach y Garaje Android: desarrollo activo y privados. Acceso-Controlado: prototipo público. Descripciones limitadas a propósito y capacidades generales verificadas.</desc>
