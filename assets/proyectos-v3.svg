<text id="texto-017" x="125" y="508" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#f1f6ff" text-anchor="start">CreditCoach</text>
<text id="texto-018" x="48" y="556" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#af87ff" text-anchor="start">Captura privada en Android</text>
<text id="texto-019" x="48" y="602" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">Registrar transacciones autorizadas con menos</text>
<text id="texto-020" x="48" y="633" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">intervención manual.</text>
<text id="texto-021" x="48" y="682" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">Captura automática desde notificaciones,</text>
<text id="texto-022" x="48" y="713" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">procesamiento en el dispositivo y</text>
<text id="texto-023" x="48" y="744" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">almacenamiento cifrado.</text>
<path d="M48 754L604 754" stroke="#af87ff" stroke-width="1" opacity="0.45" fill="none"/>
<text id="texto-024" x="48" y="788" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#b8c7d9" text-anchor="start">Kotlin · Android · Jetpack Compose</text>
<text id="texto-025" x="48" y="822" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#af87ff" text-anchor="start">PRIVADO · DESARROLLO ACTIVO</text>
