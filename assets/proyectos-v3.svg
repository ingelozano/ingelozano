<text id="texto-000" x="125" y="85" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#f1f6ff" text-anchor="start">ESCUDO Inspector</text>
<text id="texto-001" x="48" y="133" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#48e7ef" text-anchor="start">Seguridad comprensible</text>
<text id="texto-002" x="48" y="179" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">Comprender el estado de un dispositivo Android</text>
<text id="texto-003" x="48" y="210" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">sin depender de análisis remotos.</text>
<text id="texto-004" x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">Inspección autorizada, análisis local y hallazgos</text>
<text id="texto-005" x="48" y="290" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">de seguridad sustentados en evidencia.</text>
<path d="M48 331L604 331" stroke="#48e7ef" stroke-width="1" opacity="0.45" fill="none"/>
<text id="texto-006" x="48" y="365" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#b8c7d9" text-anchor="start">Rust · TypeScript · Tauri</text>
<text id="texto-007" x="48" y="399" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#48e7ef" text-anchor="start">PRIVADO · DESARROLLO ACTIVO</text>
