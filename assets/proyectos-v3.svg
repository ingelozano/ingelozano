<text id="texto-034" x="125" y="931" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#f1f6ff" text-anchor="start">Acceso-Controlado</text>
<text id="texto-035" x="48" y="979" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#86e3bd" text-anchor="start">Base física y embebida</text>
<text id="texto-036" x="48" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">Conectar entradas de usuario, detección y actuación en un prototipo físico.</text>
<text id="texto-037" x="48" y="1074" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">Teclado, sensor infrarrojo, relé temporizado y pantalla I²C integrados con Arduino.</text>
