<text id="texto-026" x="753" y="508" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#f1f6ff" text-anchor="start">Garaje Android</text>
<text id="texto-027" x="676" y="556" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#5495ff" text-anchor="start">Medición aplicada a movilidad</text>
<text id="texto-028" x="676" y="602" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">Convertir señales GPS variables en mediciones</text>
<text id="texto-029" x="676" y="633" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b8c7d9" text-anchor="start">útiles para motocicletas.</text>
<text id="texto-030" x="676" y="682" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">Valida la calidad de la señal antes de estimar</text>
<text id="texto-031" x="676" y="713" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#f1f6ff" text-anchor="start">distancia y movimiento.</text>
<path d="M676 754L1232 754" stroke="#5495ff" stroke-width="1" opacity="0.45" fill="none"/>
<text id="texto-032" x="676" y="788" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#b8c7d9" text-anchor="start">Kotlin · Android · Jetpack Compose</text>
