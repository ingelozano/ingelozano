  <title id="title">Frederick Lozano — Mechatronics Engineer</title>
  <desc id="desc">Automation, robotics, AI and software. Engineering the bridge between machines, intelligence and software. Graphite engineering panel with cyan circuit traces, a processor and an articulated mechanism.</desc>
