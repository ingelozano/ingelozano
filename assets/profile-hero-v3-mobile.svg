<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1140" width="640" height="1140" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Frederick Lozano — Ingeniero Mecatrónico</title><desc id="descripcion">Automatización, robótica, software, IA y sistemas embebidos. Diseño sistemas donde el hardware, el control y el software trabajan como una sola ingeniería. Circuitos, microcontrolador y brazo robótico como representación conceptual.</desc>
